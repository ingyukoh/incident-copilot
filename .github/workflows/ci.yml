name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: pytest -q
      - name: Evaluation
        run: python -m incident_copilot.evals --out ci-results
      - name: Checked-in results must match a fresh run
        run: python scripts/compare_results.py results/eval_report.json ci-results/eval_report.json
      - name: Demo - pause in one process, approve from another
        run: |
          incident-copilot --db demo.sqlite run INC-002 --thread demo | tee run.txt
          grep -q "PAUSED for approval" run.txt
          incident-copilot --db demo.sqlite resume demo --approve --approver ci | tee resume.txt
          grep -q "status=resolved" resume.txt
